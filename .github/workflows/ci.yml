name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      # Solo el Postgres local: aplica las 16 migraciones desde cero y corre
      # pgTAP. El stack completo (~12 contenedores) tumbaba el backend por
      # memoria en el runner; los tests no necesitan Storage/Auth/Studio.
      - run: supabase db start
      - run: supabase test db
