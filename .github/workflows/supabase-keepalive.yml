name: Supabase Keep Alive

# Secrets requeridos (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  PAT de https://supabase.com/dashboard/account/tokens
#                         OBLIGATORIO un PAT con scope projects:write, o un classic PAT.
#   SUPABASE_PROJECT_REF   ej. xvsvfwbifupfivnbhiil
#   SUPABASE_URL           https://<ref>.supabase.co   (opcional, solo ping REST)
#   SUPABASE_ANON_KEY      clave anon publica          (opcional, solo ping REST)
#
# Supabase pausa los proyectos del plan Free con baja actividad en una ventana
# de 7 dias. Este workflow consulta el estado cada 7 dias y, si detecta la
# pausa, la revierte llamando a POST /v1/projects/{ref}/restore.

on:
  schedule:
    # Supabase Free pausa el proyecto tras 7 días de inactividad.
    # Cada lunes 06:17 UTC = exactamente cada 7 días (52 ejecuciones/año).
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar verificación aunque el proyecto esté activo'
        type: boolean
        default: false

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Mantener proyecto Supabase Free activo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validar secrets
        id: secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=()
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing+=("SUPABASE_ACCESS_TOKEN")
          [ -z "$SUPABASE_PROJECT_REF" ] && missing+=("SUPABASE_PROJECT_REF")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Faltan secrets requeridos: ${missing[*]}"
            exit 1
          fi
          echo "SUPABASE_URL_PRESENT=$([ -n "$SUPABASE_URL" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "SUPABASE_ANON_KEY_PRESENT=$([ -n "$SUPABASE_ANON_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Consultar estado del proyecto
        id: status
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          HTTP_CODE="000"
          for attempt in 1 2 3; do
            HTTP_CODE=$(curl -sS -o health.json -w '%{http_code}' --max-time 60 \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/health?services=db,auth,storage,realtime") || HTTP_CODE="000"
            if [ "$HTTP_CODE" != "000" ]; then
              break
            fi
            echo "Intento $attempt falló, reintentando..." >> "$GITHUB_STEP_SUMMARY"
            sleep 10
          done

          echo "HTTP_CODE=$HTTP_CODE" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "ESTADO=activo" >> "$GITHUB_OUTPUT"
            echo "### Estado de Supabase ($SUPABASE_PROJECT_REF): activo" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$HTTP_CODE" = "402" ] || [ "$HTTP_CODE" = "403" ] || [ "$HTTP_CODE" = "404" ] || [ "${HTTP_CODE#5}" != "$HTTP_CODE" ]; then
            echo "ESTADO=pausado" >> "$GITHUB_OUTPUT"
            echo "### Estado de Supabase ($SUPABASE_PROJECT_REF): PAUSADO (HTTP $HTTP_CODE)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ESTADO=desconocido" >> "$GITHUB_OUTPUT"
            echo "### Estado de Supabase ($SUPABASE_PROJECT_REF): HTTP $HTTP_CODE" >> "$GITHUB_STEP_SUMMARY"
          fi

          cat health.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "sin respuesta" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: Despertar base de datos
        if: steps.status.outputs.ESTADO == 'pausado' || inputs.force == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            CODE=$(curl -sS -o rest.json -w '%{http_code}' --max-time 60 \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/") || CODE="000"
            echo "REST ping: HTTP $CODE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SUPABASE_URL o SUPABASE_ANON_KEY ausentes: se usa la Management API" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN no configurada"
            exit 1
          fi

          CODE="000"
          for attempt in 1 2 3 4 5 6; do
            # Un proyecto pausado por inactividad se recupera con /restore.
            # /restart solo reinicia los servicios de un proyecto ya activo.
            for endpoint in restore restart; do
              RESPONSE=$(curl -sS -o "$endpoint.json" -w '%{http_code}' --max-time 60 -X POST \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d '{}' \
                "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/$endpoint") || RESPONSE="000"

              echo "Intento $attempt -> POST /$endpoint: HTTP $RESPONSE" >> "$GITHUB_STEP_SUMMARY"
              case "$RESPONSE" in
                200|201|202)
                  echo "Proyecto reanudado vía /$endpoint"
                  CODE="$RESPONSE"
                  break 2
                  ;;
              esac
            done
            sleep 60
          done

          if [ "$CODE" = "000" ]; then
            echo "::error::No se pudo reanudar el proyecto (último HTTP: $RESPONSE)"
            cat restore.json 2>/dev/null || true
            exit 1
          fi

      - name: Verificar que el proyecto sigue activo
        if: steps.status.outputs.ESTADO == 'pausado' || inputs.force == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          sleep 45
          CODE=$(curl -sS -o final.json -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/health?services=db") || CODE="000"
          echo "Verificación final: HTTP $CODE" >> "$GITHUB_STEP_SUMMARY"
          cat final.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          [ "$CODE" = "200" ] || { echo "::error::El proyecto sigue sin responder (HTTP $CODE)"; exit 1; }
